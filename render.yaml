services:
  - type: web
    name: veilx
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ZCASH_NETWORK
        value: mainnet
      - key: NEXT_PUBLIC_ZCASH_NETWORK
        value: mainnet
      - key: ENABLE_TESTNET_SIMULATION
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ESCROW_PLATFORM_TRANSPARENT_KEY
        sync: false
      - key: NOWNODES_RPC_URL
        sync: false
      - key: NOWNODES_API_KEY
        sync: false
      - key: ZALLET_RPC_URL
        sync: false
      - key: ZALLET_RPC_API_KEY
        sync: false
      - key: TWITTER_CLIENT_ID
        sync: false
      - key: TWITTER_CLIENT_SECRET
        sync: false
      - key: TWITTER_CALLBACK_URL
        value: https://veilxapp.onrender.com/api/auth/callback/twitter
      - key: NEXT_PUBLIC_APP_URL
        value: https://veilxapp.onrender.com
      - key: TWITTER_BEARER_TOKEN
        sync: false
