[package]
name = "veilx-wallet"
version = "0.1.0"
edition = "2021"
description = "VeilX Shielded & Transparent Zcash NU7/Ironwood WebAssembly Engine"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
bip39 = { version = "2.0", default-features = false }
k256 = { version = "0.13", features = ["ecdsa", "sha256", "arithmetic"] }
blake2b_simd = "1.0"
hmac = "0.12"
sha2 = "0.10"
ripemd = "0.1"
orchard = { version = "0.16", default-features = false, features = ["circuit", "zeroize"] }
incrementalmerkletree = { version = "0.9", features = ["legacy-api"] }
zcash_note_encryption = "0.5"
pasta_curves = "0.6"
ff = "0.14"
zip32 = "0.3"
lazy_static = "1.5"
rand = "0.10"
bs58 = { version = "0.5", features = ["check"] }
bech32 = "0.9"
hex = "0.4"
getrandom = { version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
zcash_address = "0.14.0"
zcash_protocol = "0.11.0-pre.1"
pczt = { version = "0.10.0-pre.2", default-features = false, features = ["orchard", "prover"] }
wasm-bindgen-rayon = "1.3.0"

[dev-dependencies]
serde_json = "1.0"
wasm-bindgen-test = "0.3"
zcash_primitives = "0.31.0-pre.2"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
